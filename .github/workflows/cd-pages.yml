name: Silent Journey Deploy
run-name: ${{ github.ref_name }} deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 25.8.1
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build

    permissions:
      contents: write
      id-token: write

    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to Github Pages
        uses: actions/deploy-pages@v4